allowBuilds:
  '@google/genai': true
  '@mendable/firecrawl-js': true
  esbuild: true
  onnxruntime-node: false
  protobufjs: true
  sharp: false
minimumReleaseAgeExclude:
  - express-rate-limit@8.6.1
overrides:
  protobufjs@<=7.6.2: '>=7.6.3'
  protobufjs@>=7.5.0 <=7.6.4: '>=7.6.5'
  body-parser@<1.20.6: '>=1.20.6'
  uuid@<11.1.1: '>=11.1.1'
  # GHSA-7p8r-x3mc-p8w7: fast-uri host confusion via backslash authority (dev: commitlint → ajv).
  'fast-uri@>=3.0.0 <3.1.5': '>=3.1.5'
  minimatch: '^10.2.5'
  brace-expansion: '>=5.0.9'
  # @huggingface/transformers → onnxruntime-node / sharp (arena local NLP).
  # Target only vulnerable release lines; bound replacements to compatible majors.
  'adm-zip@<0.6.0': '>=0.6.0 <1.0.0'
  'sharp@<0.35.0': '>=0.35.0 <1.0.0'
  # Keep a single onnxruntime-web for the app + transformers.js tokenizer path.
  onnxruntime-web: '1.27.0'
peerDependencyRules:
  # Storybook 8 still declares vite<=6; Olive Studio runs Vite 8 (Rolldown).
  allowedVersions:
    vite: '*'
# Transitive only: Storybook docgen + google-auth/node-fetch polyfill.
allowedDeprecatedVersions:
  glob: '10'
  node-domexception: '*'
