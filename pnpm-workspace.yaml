allowBuilds:
  '@google/genai': true
  '@mendable/firecrawl-js': true
  esbuild: true
  onnxruntime-node: false
  protobufjs: true
  sharp: false
minimumReleaseAgeExclude:
  - express-rate-limit@8.6.1
overrides:
  protobufjs@<=7.6.2: '>=7.6.3'
  protobufjs@>=7.5.0 <=7.6.4: '>=7.6.5'
  body-parser@<1.20.6: '>=1.20.6'
  uuid@<11.1.1: '>=11.1.1'
  minimatch: '^10.2.5'
  brace-expansion: '5.0.8'
  # @huggingface/transformers → onnxruntime-node / sharp (arena local NLP)
  adm-zip: '>=0.6.0'
  sharp: '>=0.35.0'
peerDependencyRules:
  # Storybook 8 still declares vite<=6; Olive Studio runs Vite 8 (Rolldown).
  allowedVersions:
    vite: '*'
# Transitive only: Storybook docgen + google-auth/node-fetch polyfill.
allowedDeprecatedVersions:
  glob: '10'
  node-domexception: '*'
