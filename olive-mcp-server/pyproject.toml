[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olive-mcp-server"
version = "0.1.0"
description = "MCP server for Microsoft Olive model optimization guidance"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
olive-mcp-server = "olive_mcp_server.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["olive_mcp_server*"]

[tool.setuptools.package-data]
olive_mcp_server = ["knowledge_base/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
