[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olive-mcp-server"
version = "0.5.0"
description = "MCP server for Microsoft Olive model optimization"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["olive", "onnx", "model-optimization", "mcp", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "sentence-transformers>=3.0.0,<6",
    "numpy>=1.24.0,<3",
]

[project.urls]
Homepage = "https://github.com/asiraky/olive-studio"
Repository = "https://github.com/asiraky/olive-studio"
"Bug Tracker" = "https://github.com/asiraky/olive-studio/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0,<7",
]
# Semantic stack is a core dep today; keep the extra for explicit installs /
# future slim core splits.
semantic = [
    "sentence-transformers>=3.0.0,<6",
    "numpy>=1.24.0,<3",
]

[project.scripts]
olive-mcp = "olive_mcp_server.mcp_server:main"
olive-mcp-server = "olive_mcp_server.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["olive_mcp_server*"]

[tool.setuptools.package-data]
olive_mcp_server = [
    "knowledge_base/*.json",
    "knowledge_base/indexes/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# S106: Suppress "possible hardcoded password" for pass_name keyword argument in tests
"tests/**" = ["S106"]
