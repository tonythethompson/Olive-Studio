[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olive-mcp-server"
version = "0.1.0"
description = "MCP server for Microsoft Olive model optimization guidance"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "sentence-transformers>=3.0.0,<6",
    "numpy>=1.24.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
olive-mcp-server = "olive_mcp_server.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["olive_mcp_server*"]

[tool.setuptools.package-data]
olive_mcp_server = ["knowledge_base/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# S106: Suppress "possible hardcoded password" for pass_name keyword argument in tests
"tests/**" = ["S106"]
