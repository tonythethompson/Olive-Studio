[package]
name = "olive-studio"
version = "0.3.0"
description = "Desktop shell for Olive Studio — local Microsoft Olive recipe builder"
authors = ["Anthony Thompson"]
license = "MIT"
repository = "https://github.com/tonythethompson/Olive-Studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
