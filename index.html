<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olive Studio</title>
    <!-- Import map for externalized optional dependencies (Playground panels only).
         These load on-demand when users open Arena/Inference/Benchmark panels. -->
    <script type="importmap">
      {
        "imports": {
          "onnxruntime-web": "https://esm.sh/onnxruntime-web@1.27.0",
          "@huggingface/transformers": "https://esm.sh/@huggingface/transformers@4.2.0",
          "typegpu": "https://esm.sh/typegpu@0.11.9"
        }
      }
    </script>
    <!-- Synchronous theme init — prevents flash of wrong theme before React mounts -->
    <script>
      (function () {
        var STORAGE_KEY = "olive:preferences";
        var ATTR = "data-theme";

        function getResolved() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              var parsed = JSON.parse(raw);
              var pref = parsed && parsed.state && parsed.state.themePreference;
              if (pref === "light" || pref === "dark") return pref;
            }
          } catch (e) { /* corrupted or unavailable — fall through */ }
          if (typeof window.matchMedia === "function") {
            return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          return "light";
        }

        var theme = getResolved();
        document.documentElement.setAttribute(ATTR, theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
