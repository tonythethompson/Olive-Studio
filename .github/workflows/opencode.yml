name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Probe primary model availability
        id: probe
        shell: bash
        env:
          ALIBABA_TOKEN_PLAN_API_KEY: ${{ secrets.ALIBABA_TOKEN_PLAN_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          MODEL="opencode/big-pickle"
          if ! curl -sf --max-time 15 \
            -X POST "https://opencode.ai/zen/v1/chat/completions" \
            -H "Authorization: Bearer ${OPENCODE_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"model":"big-pickle","messages":[{"role":"user","content":"ping"}],"max_tokens":1}' \
            >/dev/null 2>&1; then
            echo "::warning::Primary model (opencode/big-pickle) unavailable - falling back to alibaba-token-plan"
            MODEL="alibaba-token-plan/qwen3.8-max"
            if ! curl -sf --max-time 15 \
              -X POST "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1/chat/completions" \
              -H "Authorization: Bearer ${ALIBABA_TOKEN_PLAN_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"model":"qwen3.8-max","messages":[{"role":"user","content":"ping"}],"max_tokens":1}' \
              >/dev/null 2>&1; then
              echo "::warning::alibaba-token-plan unavailable - falling back to DashScope"
              MODEL="alibaba/qwen3.8-max"
            fi
          fi
          echo "model=${MODEL}" >> "$GITHUB_OUTPUT"

      - name: Run opencode
        uses: anomalyco/opencode/github@14b37df39168eaf6a6faf862ec4a7bbe9c825bbd # v1.18.18
        env:
          ALIBABA_TOKEN_PLAN_API_KEY: ${{ secrets.ALIBABA_TOKEN_PLAN_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ steps.probe.outputs.model }}
