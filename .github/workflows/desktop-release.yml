name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      # Serialize matrix legs: tauri-action updates shared latest.json via a
      # non-atomic read-merge-delete-upload. Concurrent jobs can clobber each
      # other's platform entries (or 404 deleting an already-replaced asset).
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_target: universal-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify tag matches package versions
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAURI_VER="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          PKG_VER="$(node -p "require('./package.json').version")"
          CARGO_VER="$(node -e "const fs=require('fs'); const m=fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version\\s*=\\s*\\\"([^\\\"]+)\\\"/m); if (!m) process.exit(1); console.log(m[1]);")"
          echo "tag=$TAG tauri=$TAURI_VER cargo=$CARGO_VER package=$PKG_VER"
          if [ "$TAG" != "$TAURI_VER" ] || [ "$TAG" != "$CARGO_VER" ] || [ "$TAG" != "$PKG_VER" ]; then
            echo "Release tag must match src-tauri/tauri.conf.json, src-tauri/Cargo.toml, and package.json versions"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Bundle Node runtime (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p src-tauri/node-runtime
          install -m 0755 "$(command -v node)" src-tauri/node-runtime/node
          src-tauri/node-runtime/node --version

      - name: Bundle Node runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/node-runtime | Out-Null
          Copy-Item (Get-Command node).Source src-tauri/node-runtime/node.exe -Force
          & src-tauri/node-runtime/node.exe --version

      - name: Install macOS universal target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Bundle Node runtime (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="$(node -p 'process.version')"
          NODE_STAGE="$(mktemp -d)"
          X64_ARCHIVE="node-${NODE_VERSION}-darwin-x64.tar.gz"
          ARM64_ARCHIVE="node-${NODE_VERSION}-darwin-arm64.tar.gz"
          trap 'rm -rf "$NODE_STAGE"' EXIT

          curl --fail --silent --show-error --location --retry 3 \
            "https://nodejs.org/dist/${NODE_VERSION}/${X64_ARCHIVE}" \
            --output "$NODE_STAGE/$X64_ARCHIVE"
          curl --fail --silent --show-error --location --retry 3 \
            "https://nodejs.org/dist/${NODE_VERSION}/${ARM64_ARCHIVE}" \
            --output "$NODE_STAGE/$ARM64_ARCHIVE"
          curl --fail --silent --show-error --location --retry 3 \
            "https://nodejs.org/dist/${NODE_VERSION}/SHASUMS256.txt" \
            --output "$NODE_STAGE/SHASUMS256.txt"
          {
            grep -F "  $X64_ARCHIVE" "$NODE_STAGE/SHASUMS256.txt"
            grep -F "  $ARM64_ARCHIVE" "$NODE_STAGE/SHASUMS256.txt"
          } > "$NODE_STAGE/SHASUMS256.selected"
          (cd "$NODE_STAGE" && shasum -a 256 -c SHASUMS256.selected)
          tar -xzf "$NODE_STAGE/$X64_ARCHIVE" -C "$NODE_STAGE"
          tar -xzf "$NODE_STAGE/$ARM64_ARCHIVE" -C "$NODE_STAGE"

          mkdir -p src-tauri/node-runtime
          lipo -create \
            "$NODE_STAGE/node-${NODE_VERSION}-darwin-x64/bin/node" \
            "$NODE_STAGE/node-${NODE_VERSION}-darwin-arm64/bin/node" \
            -output src-tauri/node-runtime/node
          chmod 0755 src-tauri/node-runtime/node
          lipo -verify_arch x86_64 arm64 src-tauri/node-runtime/node
          src-tauri/node-runtime/node --version

      - run: pnpm install --frozen-lockfile
        env:
          OLIVE_SKIP_MCP_SETUP: "1"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Publishes installers + updater latest.json to this GitHub Release.
          # Packaged clients read:
          # https://github.com/tonythethompson/Olive-Studio/releases/latest/download/latest.json
          # (Draft releases are invisible to /latest until published.)
          tagName: ${{ github.ref_name }}
          releaseName: "Olive Studio ${{ github.ref_name }}"
          releaseBody: |
            See CHANGELOG.md for details.

            ### macOS Installation (Unsigned DMG)

            The macOS DMG is not code-signed or notarized. On first launch,
            right-click (or Control-click) the Olive Studio application, select
            **Open**, then click **Open** in the confirmation dialog. This is only
            required on first launch.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.tauri_target }}

      - name: Verify Linux artifacts (AppImage + DEB)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          echo "Checking for Linux artifacts..."
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "ERROR: Bundle directory not found at $BUNDLE_DIR"
            exit 1
          fi
          find "$BUNDLE_DIR" -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec ls -lh {} \;
          APPIMAGE_COUNT=$(find "$BUNDLE_DIR" -name "*.AppImage" | wc -l)
          DEB_COUNT=$(find "$BUNDLE_DIR" -name "*.deb" | wc -l)
          echo "Found $APPIMAGE_COUNT AppImage(s) and $DEB_COUNT DEB package(s)"
          if [ "$APPIMAGE_COUNT" -eq 0 ] || [ "$DEB_COUNT" -eq 0 ]; then
            echo "ERROR: Expected both AppImage and DEB packages"
            exit 1
          fi

      - name: Build MSIX (Microsoft Store)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version")
          ./scripts/build-msix.ps1 `
            -ReleaseDir "src-tauri/target/${{ matrix.tauri_target }}/release" `
            -Version $version `
            -OutFile "src-tauri/target/${{ matrix.tauri_target }}/release/bundle/msix/OliveStudio_$version.msix"

      - name: Upload MSIX to release
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release upload "$RELEASE_TAG" \
            "src-tauri/target/${{ matrix.tauri_target }}/release/bundle/msix/OliveStudio_${VERSION}.msix" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Smoke test macOS artifact
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.tauri_target }}/release/bundle"

          # Find the .app bundle inside the macos output directory
          APP_BUNDLE="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "ERROR: No .app bundle found in $BUNDLE_DIR/macos"
            exit 1
          fi
          echo "Found app bundle: $APP_BUNDLE"

          # Verify bundled Node runtime exists and is executable
          RESOURCES="$APP_BUNDLE/Contents/Resources"
          NODE="$RESOURCES/node-runtime/node"
          if [ ! -f "$NODE" ]; then
            echo "ERROR: Bundled Node runtime not found at $NODE"
            echo "Contents of Resources/node-runtime/:"
            ls -la "$RESOURCES/node-runtime/" 2>/dev/null || echo "(directory missing)"
            exit 1
          fi
          test -x "$NODE"
          lipo -verify_arch x86_64 arm64 "$NODE"
          echo "Bundled Node version: $($NODE --version)"

          # Verify server.mjs exists
          SERVER_MJS="$RESOURCES/dist/server.mjs"
          if [ ! -f "$SERVER_MJS" ]; then
            echo "ERROR: server.mjs not found at $SERVER_MJS"
            exit 1
          fi

          # Boot the server and hit /api/health
          SERVER_ROOT="$RESOURCES"
          PORT=31415
          cd "$SERVER_ROOT" && PORT=$PORT "$NODE" dist/server.mjs &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then
              echo "macOS smoke test passed — server started from packaged .app bundle"
              exit 0
            fi
            sleep 1
          done
          echo "macOS smoke test FAILED — server did not respond within 20s"
          exit 1
