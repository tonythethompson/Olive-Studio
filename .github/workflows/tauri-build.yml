name: Tauri Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri (NSIS + MSIX)
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis,msix
        env:
          # Tauri updater artifact signing (not Windows Authenticode/MSIX code signing)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: olive-studio-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: olive-studio-msix
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msix/*.msix
          if-no-files-found: error
