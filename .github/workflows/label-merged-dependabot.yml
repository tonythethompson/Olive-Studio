name: Label merged Dependabot PRs

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.merged == true
    steps:
      - name: Label as auto-merged
        run: gh pr edit "$PR_URL" --add-label "auto-merged"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
