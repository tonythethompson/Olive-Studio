name: Publish Olive MCP Server to PyPI

on:
  push:
    tags:
      - "mcp-server/v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 3.11+: tomllib is stdlib (no tomli). packaging parses PEP 508 specifiers.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build packaging

      - name: Verify version matches tag
        working-directory: olive-mcp-server
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mcp-server/v}"
          PKG_VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.load(Path("pyproject.toml").open("rb"))
          print(data["project"]["version"])
          PY
          )
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: tag says $TAG_VERSION but pyproject.toml says $PKG_VERSION"
            exit 1
          fi

      - name: Verify mcp dependency is pinned below 2
        working-directory: olive-mcp-server
        run: |
          python - <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          from packaging.requirements import Requirement
          from packaging.version import InvalidVersion, Version

          data = tomllib.load(Path("pyproject.toml").open("rb"))
          deps = data.get("project", {}).get("dependencies", [])
          req = None
          for dep in deps:
              parsed = Requirement(dep)
              if parsed.name == "mcp":
                  req = parsed
                  break
          if req is None:
              print("::error::mcp dependency is missing from project.dependencies")
              sys.exit(1)

          spec = req.specifier
          print(f"MCP constraint: {req}")
          if not spec:
              print("::error::mcp dependency must be pinned below 2 (unpinned specifier)")
              sys.exit(1)

          def series_version(raw: str) -> Version | None:
              prefix = raw.split("*", 1)[0].rstrip(".") or "0"
              try:
                  return Version(prefix if prefix.count(".") else prefix + ".0")
              except InvalidVersion:
                  return None

          def is_2_ceiling(ver: Version) -> bool:
              # <2 / <2.0 / <2.0.0 exclude released 2.x; <2.0.1 still allows 2.0.0.
              if ver.major < 2:
                  return True
              if ver.post or ver.dev is not None or ver.is_prerelease:
                  return False
              return ver.major == 2 and all(part == 0 for part in ver.release[1:])

          def excludes_released_2x() -> bool:
              for item in spec:
                  op, raw = item.operator, item.version
                  if "*" in raw:
                      series = series_version(raw)
                      if series is None:
                          continue
                      if op in ("==", "===", "~=") and series.major == 2:
                          return False
                      if op in ("==", "===", "~=") and series.major != 2:
                          return True
                      continue
                  try:
                      ver = Version(raw)
                  except InvalidVersion:
                      continue
                  if op in ("==", "===") and ver.major == 2 and not ver.is_prerelease:
                      return False
                  if op == "~=" and ver.major == 2:
                      return False
                  if op in ("==", "===", "~=") and ver.major != 2:
                      return True
              for item in spec:
                  op, raw = item.operator, item.version
                  if op not in ("<", "<="):
                      continue
                  if "*" in raw:
                      series = series_version(raw)
                      if series is not None and op == "<" and series.major <= 2:
                          return True
                      if series is not None and op == "<=" and series.major < 2:
                          return True
                      continue
                  try:
                      ver = Version(raw)
                  except InvalidVersion:
                      continue
                  if op == "<" and is_2_ceiling(ver):
                      return True
                  if op == "<=" and ver.major < 2:
                      return True
              return False

          if not excludes_released_2x():
              print("::error::mcp dependency must not allow 2.x (e.g. 'mcp>=1,<2'). Got: " + str(req))
              sys.exit(1)
          print("mcp pin excludes 2.x")
          PY

      - name: Build package
        working-directory: olive-mcp-server
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: olive-mcp-server/dist/
