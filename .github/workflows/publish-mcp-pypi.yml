name: Publish Olive MCP Server to PyPI

on:
  push:
    tags:
      - "mcp-server/v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 3.11+: tomllib is stdlib (no tomli). packaging parses PEP 508 specifiers.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build packaging

      - name: Verify version matches tag
        working-directory: olive-mcp-server
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mcp-server/v}"
          PKG_VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.load(Path("pyproject.toml").open("rb"))
          print(data["project"]["version"])
          PY
          )
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: tag says $TAG_VERSION but pyproject.toml says $PKG_VERSION"
            exit 1
          fi

      - name: Verify mcp dependency is pinned below 2
        working-directory: olive-mcp-server
        run: |
          python - <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          from packaging.requirements import Requirement
          from packaging.version import Version

          data = tomllib.load(Path("pyproject.toml").open("rb"))
          deps = data.get("project", {}).get("dependencies", [])
          req = None
          for dep in deps:
              parsed = Requirement(dep)
              if parsed.name == "mcp":
                  req = parsed
                  break
          if req is None:
              print("::error::mcp dependency is missing from project.dependencies")
              sys.exit(1)

          spec = req.specifier
          print(f"MCP constraint: {req}")
          if not spec:
              print("::error::mcp dependency must be pinned below 2 (unpinned specifier)")
              sys.exit(1)

          # Reject any specifier that allows any 2.x (including prereleases).
          probes = [Version("2.0.0a0"), Version("2.0.0"), Version("2.0.1"), Version("2.1.0"), Version("2.99.99")]
          if any(spec.contains(v, prereleases=True) for v in probes):
              print("::error::mcp dependency must not allow 2.x (e.g. 'mcp>=1,<2'). Got: " + str(req))
              sys.exit(1)
          print("mcp pin excludes 2.x")
          PY

      - name: Build package
        working-directory: olive-mcp-server
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: olive-mcp-server/dist/
